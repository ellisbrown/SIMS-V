[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[project]
name = "sims-datagen"
version = "0.1.0"
description = "SIMS-V trajectory and spatial video-QA data generation pipeline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9,<3.10"
authors = [
    { name = "Ellis Brown" },
    { name = "Arijit Ray" },
    { name = "Ranjay Krishna" },
    { name = "Ross Girshick" },
    { name = "Rob Fergus" },
    { name = "Saining Xie" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "ai2thor",
    "allenact",
    "allenact-plugins",
    "attrs",
    "canonicaljson>=2.0.0",
    "ezcolorlog>=1.0.3",
    "filelock>=3.18.0",
    "gym",
    "h5py>=3.14.0",
    "imageio",
    "matplotlib",
    "networkx",
    "nltk",
    "numpy",
    "omegaconf>=2.3.0",
    "opencv-python-headless==4.12.0.88",
    "pillow",
    "prior>=1.0.3",
    "scikit-image",
    "scipy",
    "setproctitle>=1.3.6",
    "shapely>=2.0.7",
    "torch>=2.7.1",
    "tqdm",
    "typing-extensions",
]

[project.scripts]
sims-v = "sims.cli:main"

[project.urls]
Homepage = "https://ellisbrown.github.io/sims-v/"
Paper = "https://arxiv.org/abs/2511.04668"
Repository = "https://github.com/ellisbrown/SIMS-V"
Dataset = "https://huggingface.co/datasets/ellisbrown/SIMS-VSI"

[tool.uv]
build-constraint-dependencies = ["setuptools<82"]
override-dependencies = [
    # AI2-THOR and AllenAct declare the GUI OpenCV distribution. The headless
    # distribution above provides the same ``cv2`` API without cluster GUI libs.
    "opencv-python==4.12.0.88; sys_platform == 'never'",
]

[tool.uv.build-backend]
module-name = "sims"
module-root = "src"

[tool.uv.sources]
nltk = { git = "https://github.com/nltk/nltk.git", rev = "582e6e3" }
# AI2-THOR publishes a small official wheel for this exact simulator commit.
ai2thor = { url = "https://ai2thor-pypi.allenai.org/ai2thor/ai2thor-0%2Bbfdffefc19494d2e807133a11741d18054a09a86-py2.py3-none-any.whl" }
allenact = { git = "https://github.com/ellisbrown/allenact.git", subdirectory = "allenact", rev = "7789182538af764406e958b93fb5451a88404c9a" }
allenact-plugins = { git = "https://github.com/ellisbrown/allenact.git", subdirectory = "allenact_plugins", rev = "7789182538af764406e958b93fb5451a88404c9a" }

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pip>=25.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
]
